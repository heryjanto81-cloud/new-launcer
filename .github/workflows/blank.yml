name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --console=plain --stacktrace 2>&1 | tee build.log

      - name: Show compile errors (only if build failed)
        if: failure()
        shell: bash
        run: |
          echo "=============== ERROR SUMMARY ==============="
          grep -nE "^e: |error:|What went wrong|Execution failed|Could not " -A4 build.log | head -150 || true

      - name: Upload build log (only if build failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk GlassLauncher.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlassLauncher-APK
          path: GlassLauncher.apk

      - name: Publish GitHub Release (only for tags like v1.0)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: GlassLauncher.apk
